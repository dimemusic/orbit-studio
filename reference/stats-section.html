<title>Cloud Sphere Stats B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&display=swap">
<style>
/* layout: three glass cards; a live scene on top (map · orbit · pulse), the number and its meaning below */
:root{
  --bg:#05070d; --fg:#e8edf7; --body:#8b95ab; --faint:#5b6478; --blue:#3d8bff; --mint:#4fe3c1; --violet:#a78bfa; --amber:#ffb27a;
  --glass:rgb(10 13 21/.72); --line:rgb(255 255 255/.07);
  --f:"Geologica",system-ui,sans-serif; --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:15px;line-height:1.5;min-height:100vh;display:grid;place-items:center;
  padding-block:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(50% 40% at 50% 50%,rgb(61 139 255/.06),transparent 70%),var(--bg)}
.row{width:100%;max-width:1120px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);overflow:hidden;
  display:flex;flex-direction:column;min-width:0}
.scene{height:200px;position:relative;border-bottom:1px solid var(--line);
  background:radial-gradient(70% 80% at 50% 60%,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%)}
.meta{padding:24px 28px 28px;text-align:left}
.num{font:600 44px/1 var(--f);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.num em{font-style:normal;color:var(--c)}
.lab{margin-top:10px;color:var(--body);font-size:14px}

/* 1 · dotted world map, lit dots = cities where studios work */
.map{position:absolute;left:50%;top:50%;width:calc(100% - 56px);aspect-ratio:71/34;max-height:calc(100% - 48px);transform:translate(-50%,-50%)}
.map i{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:rgb(255 255 255/.12);transform:translate(-50%,-50%)}
.map b{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);transform:translate(-50%,-50%) scale(0);
  transition:transform .5s var(--ease);cursor:default}
.on .map b{transform:translate(-50%,-50%) scale(1)}
.map b:hover{background:#9cc4ff}
.map b.ping::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--blue);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.4)}}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;pointer-events:none;font-size:12px;color:var(--fg);
  background:#0f131d;border:1px solid rgb(255 255 255/.12);border-radius:8px;padding:4px 9px;opacity:0;transition:opacity .15s;z-index:3}
.tip.show{opacity:1}
.tip span{color:var(--body)}

/* 2 · encrypted files orbit a glowing lock sphere */
.orb{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#b9fff0,#4fe3c1 35%,#0f6b5b 80%);box-shadow:0 0 40px rgb(79 227 193/.45),0 0 90px rgb(79 227 193/.2);
  display:grid;place-items:center}
.orb svg{width:24px;height:24px;color:#063b33}
.ring{position:absolute;left:50%;top:50%;border:1px solid rgb(79 227 193/.14);border-radius:50%;transform:translate(-50%,-50%)}
.chipf{position:absolute;left:50%;top:50%;font-size:11px;font-weight:500;padding:4px 8px;border-radius:7px;white-space:nowrap;
  background:rgb(15 19 29/.92);border:1px solid rgb(255 255 255/.1);color:var(--fg);will-change:transform,opacity}
.chipf u{text-decoration:none;color:var(--c2)}

/* 3 · uptime: one square per day for a year (GitHub-style), amber = a day with downtime */
.year{position:absolute;left:24px;right:24px;top:28px;bottom:56px;display:grid;grid-template-columns:repeat(37,1fr);gap:3px;align-content:center}
.year span{aspect-ratio:1}
.year span{border-radius:1.5px;background:rgb(255 255 255/.06);transition:background .4s var(--ease);cursor:default}
.on .year span{background:rgb(79 227 193/var(--a))}
.on .year span.bad{background:var(--amber)}
.year span.now{animation:now 1.6s ease-in-out infinite}
@keyframes now{50%{background:#b5ffe9;box-shadow:0 0 8px var(--mint)}}
.year span:hover{outline:1px solid rgb(255 255 255/.6)}
.legend{position:absolute;left:24px;right:24px;bottom:20px;display:flex;gap:16px;font-size:12px;color:var(--body)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px}
.legend i.now{background:var(--mint);box-shadow:0 0 6px var(--mint)}

@media (max-width:860px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="row" id="row">
  <div class="card" style="--c:var(--blue)">
    <div class="scene"><div class="map" id="map" aria-label="Мапа студій"></div><div class="tip" id="tip"></div></div>
    <div class="meta"><div class="num"><span id="n1">12 400</span><em>+</em></div><div class="lab">студій і продакшенів у 13 країнах</div></div>
  </div>

  <div class="card" style="--c:var(--mint)">
    <div class="scene" id="orbit" aria-hidden="true">
      <div class="ring" style="width:220px;height:84px"></div>
      <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    </div>
    <div class="meta"><div class="num">3,8 <em>ПБ</em></div><div class="lab">файлів під шифруванням, ключ лише в тебе</div></div>

  <div class="card" style="--c:var(--violet)">
    <div class="scene"><div class="year" id="year" aria-label="Доступність за останні 365 днів"></div><div class="tip" id="tip3"></div>
      <div class="legend"><span><i style="background:rgb(79 227 193/.7)"></i>працювало</span><span><i style="background:var(--amber)"></i>простій</span><span><i class="now"></i>сьогодні</span></div></div>
    <div class="meta"><div class="num">99,95<em>%</em></div><div class="lab">доступність за рік: 4 години простою на 365 днів</div></div>
  </div>
</div>
</div>
