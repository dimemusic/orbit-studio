name: shots
on:
  push:
    branches: [shots-bot]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p /tmp/s && cd /tmp/s && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1.5 });
            await p.goto('https://avtoban-trailers.vercel.app/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(2500);
            const h = await p.evaluate(() => document.documentElement.scrollHeight);
            let i = 0;
            for (let y = 0; y < h && i < 8; y += 900, i++) {
              await p.evaluate((y) => window.scrollTo(0, y), y);
              await p.waitForTimeout(1500);
              await p.screenshot({ path: process.env.GITHUB_WORKSPACE + `/shots/s${i}.png` });
            }
            await b.close();
          })();
          JS
          mkdir -p $GITHUB_WORKSPACE/shots && node s.js
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add shots && git commit -m "shots" && git push
