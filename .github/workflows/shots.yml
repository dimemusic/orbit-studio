name: shots
on:
  push:
    branches: [shots-bot]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p /tmp/s && cd /tmp/s && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          const sites = {
            maina: 'https://maina-site2.vercel.app/',
            avtoban: 'https://avtoban-trailers.vercel.app/',
            biganskiy: 'https://biganskiy-site.vercel.app/',
            'krendel-a': 'https://bakery-landing.vercel.app/',
            'krendel-b': 'https://krendel.vercel.app/',
            'krendel-c': 'https://bakery-landing-dimemusic.vercel.app/',
          };
          (async () => {
            const b = await chromium.launch();
            for (const [n, u] of Object.entries(sites)) {
              try {
                const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
                const r = await p.goto(u, { waitUntil: 'networkidle', timeout: 45000 });
                if (!r || r.status() >= 400) { console.log('skip', n, r && r.status()); await p.close(); continue; }
                await p.waitForTimeout(2000);
                const h = Math.min(await p.evaluate(() => document.documentElement.scrollHeight), 12000);
                for (let y = 0; y < h; y += 450) { await p.evaluate((y) => window.scrollTo(0, y), y); await p.waitForTimeout(250); }
                await p.evaluate(() => window.scrollTo(0, 0)); await p.waitForTimeout(1500);
                await p.screenshot({ path: process.env.GITHUB_WORKSPACE + `/shots/${n}.jpg`, fullPage: true, type: 'jpeg', quality: 85 });
                console.log('ok', n, h);
                await p.close();
              } catch (e) { console.log('fail', n, e.message); }
            }
            await b.close();
          })();
          JS
          mkdir -p $GITHUB_WORKSPACE/shots && node s.js
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add shots && git commit -m "shots-full" && git push
